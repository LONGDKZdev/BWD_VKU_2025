<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIETNAM Self+Rise</title>
    <link rel="stylesheet" href="src/css/index1.css">
    <link rel="icon" type="image" href="src/images/LogoSelfRise.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+DK+Loopet&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+DK+Loopet&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
      <!-- AOS CSS -->
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar" >
        <div class="logo">
            <a href="index.html" class="logo-text">
                <div class="logo-main">
                    <span class="logo-viet">VIET</span>
                    <span class="logo-nam">NAM</span>
                    <span class="logo-SelfRise">Self+Rise</span>
                </div>
                <span class="logo-subtitle">SỨC KHOẺ LÀ CUỘC SỐNG CỦA CHÚNG TA</span>
            </a>
        </div>
    </nav>

    <main>
        <section class="hero">
            <div class="hero-content">
                <div class="hero-text"  data-aos="fade-right" data-aos-duration="1000">
                    <h1 class="main-title">VIET<span class="highlight">NAM</span></h1>
                    <h1 class="main-title">Self+<span class="highlight">Rise</span></h1>
                    <p class="subtitle">Cùng nhau phát triển – từ học tập đến lối sống lành mạnh.</p>
                    <div><a href="index2.html" class="join-button">Tham Gia</a></div>
                </div>
                <div class="leaf-decoration left"></div>
                <div class="leaf-decoration right"></div>
            </div>
        </section>
    </main>
</body>
<!-- AOS JS -->
<script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init();
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
      const joinButton = document.querySelector('.join-button');
      const heroContent = document.querySelector('.hero-content');
  
      joinButton.addEventListener('click', function (e) {
        e.preventDefault(); // Ngăn chuyển trang ngay
  
        // Thêm class để kích hoạt hiệu ứng
        heroContent.classList.add('exit');
  
        // Đợi hiệu ứng xong (600ms), rồi chuyển trang
        setTimeout(function () {
          window.location.href = joinButton.getAttribute('href');
        }, 600);
      });
    });
  </script>
  
  
</html>

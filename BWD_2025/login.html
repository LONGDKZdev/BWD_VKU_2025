<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - VIETNAM Self+Rise</title>
    <link rel="stylesheet" href="src/css/login-styles.css">
    <link rel="icon" type="image" href="src/images/LogoSelfRise.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="src/css/notification.css">
</head>

<body>
    <video class="video-background" autoplay muted loop>
        <source src="src/images/intro.mp4" type="video/mp4">
    </video>
    <div class="login-page">
        <div class="login-container">
            <div class="login-left">
                <div class="login-content">
                    <h1>VIETNAM <span class="highlight">Self+Rise</span></h1>
                    <p class="tagline">Nâng cao sức khỏe - Nâng tầm cuộc sống</p>

                    <div class="form-container">
                        <h2>Đăng nhập</h2>
                        <form id="login-form" class="login-form">
                            <div class="input-group">
                                <i class="fas fa-user"></i>
                                <input type="text" id="email" placeholder="Tên đăng nhập" required>
                                <span class="focus-border"></span>
                            </div>

                            <div class="input-group">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="password" placeholder="Mật khẩu" required>
                                <span class="focus-border"></span>
                            </div>

                            <div class="form-options">
                                <div class="remember-me">
                                    <input type="checkbox" id="remember">
                                    <label for="remember">Ghi nhớ đăng nhập</label>
                                </div>
                                <a href="forgot-password.html" class="forgot-password">Quên mật khẩu?</a>
                            </div>

                            <button id="login-btn" type="submit" class="login-button">
                                <span>Đăng nhập</span>
                                <i class="fas fa-arrow-right"></i>
                            </button>
                        </form>

                        <div class="social-login">
                            <p>Hoặc đăng nhập với</p>
                            <div class="social-icons">
                                <!-- <a href="#" class="social-icon facebook"><i class="fab fa-facebook-f"></i></a> -->
                                <button class="social-icon google" id="google-register" type="button"><i
                                        class="fab fa-google"></i></button>
                                <button class="social-icon github" id="github-register" type="button"><i
                                        class="fab fa-github"></i></button>

                            </div>
                        </div>

                        <div class="register-link">
                            <p>Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a></p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="login-right">
                <div class="fitness-quote">
                    <h2>"Sức khỏe là nền tảng của thành công"</h2>
                    <p>Tham gia cùng chúng tôi để xây dựng lối sống lành mạnh và tích cực</p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script type="module">
        import { auth } from "./src/core/firebase.js";
        import { signInWithGoogle, signInWithGithub } from "./src/modules/auth/social-auth.js";
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

        let notificationTimeout1, notificationTimeout2;

        function showNotification(message, type = 'success', duration = 2500) {
            const notification = document.getElementById('notification');

            clearTimeout(notificationTimeout1);
            clearTimeout(notificationTimeout2);

            notification.textContent = message;
            notification.className = `notification show ${type}`;

            notificationTimeout1 = setTimeout(() => {
                notification.classList.remove('show');
                notificationTimeout2 = setTimeout(() => {
                    notification.textContent = '';
                    notification.className = 'notification';
                }, 500);
            }, duration);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const form = document.getElementById("login-form");
            if (!form) return;

            const googleBtn = document.getElementById("google-register");
            const githubBtn = document.getElementById("github-register");

            googleBtn?.addEventListener("click", signInWithGoogle);
            githubBtn?.addEventListener("click", signInWithGithub);

            form.addEventListener("submit", async (e) => {
                e.preventDefault();

                const email = form["email"].value;
                const password = form["password"].value;

                if (!email || !password) {
                    showNotification("❗📋✍️​ Vui lòng điền đầy đủ thông tin.", "error");
                    return;
                }

                try {
                    const result = await signInWithEmailAndPassword(auth, email, password);
                    showNotification("✅ Đăng nhập thành công!", 'success', 2000);
                    setTimeout(() => {
                        showNotification("👍 Đang điều hướng tới trang khám phá...", 'info', 2500);
                        setTimeout(() => {
                            window.location.href = "explore.html";
                        }, 2500);
                    }, 2200);

                } catch (err) {
                    showNotification("❌ Lỗi: " + err.message, "error");
                }
            });
        });
    </script>
    <div id="notification" class="notification"></div>
</body>

</html>
